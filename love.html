<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤ 爱心祝福 ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

  /* ====== 开始页 ====== */
  #start {
    position: fixed; inset: 0; z-index: 999999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fbc2eb 100%);
    cursor: pointer; user-select: none;
    transition: opacity .5s;
  }
  #start .heart-icon {
    font-size: 90px; animation: beat 1.2s infinite;
  }
  #start p {
    margin-top: 24px; font-size: 22px; color: #fff;
    font-family: "Microsoft YaHei", sans-serif; letter-spacing: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.25); }
    40% { transform: scale(1); }
    60% { transform: scale(1.15); }
  }

  /* ====== 弹窗 ====== */
  .popup {
    position: fixed; z-index: 10;
    width: 150px; height: 62px;
    background: #fff5f8;
    border: 1px solid #f7c5d8;
    border-radius: 0 0 8px 8px;
    box-shadow: 0 3px 12px rgba(244,143,177,.28);
    overflow: hidden;
    animation: pop .35s ease-out;
    transition: opacity .3s, transform .3s;
  }
  /* 标题栏（粉嫩风格） */
  .popup .bar {
    height: 26px;
    background: linear-gradient(180deg, #fbc2d4, #f9a8c5);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px;
  }
  .popup .bar span {
    color: #fff; font-size: 12px; font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 1px 2px rgba(233,121,168,.4);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .popup .bar .x {
    flex: none; width: 18px; height: 18px; line-height: 16px; text-align: center;
    background: #f472b6; color: #fff; font-size: 12px; border-radius: 4px;
    font-family: Arial, sans-serif;
  }
  /* 内容区 */
  .popup .body {
    height: calc(100% - 26px);
    display: flex; align-items: center; justify-content: center;
    padding: 2px 6px;
    color: #b0577d; font-size: 12px; line-height: 1.4;
    font-family: "Microsoft YaHei", sans-serif; text-align: center;
    word-break: break-all;
  }
  @keyframes pop {
    0%   { transform: scale(.2); opacity: 0; }
    70%  { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  /* 爱心阶段结束后淡出消失 */
  .popup.fade { opacity: 0; transform: scale(.4); }
</style>
</head>
<body>

<!-- 开始页：点击后启动动画 -->
<div id="start">
  <div class="heart-icon">💖</div>
  <p>点击一下，收下杰宝的关心</p>
</div>

<script>
/* ===================== 在这里修改你的自定义文字 ===================== */
// 祝福语列表：每个弹窗会随机显示其中一条，可自由增删
const MESSAGES = [
  "好好照顾自己",
  "记得按时吃饭",
  "天气降温了记得添衣",
  "祝愿宝宝天天开心",
  "多喝热水",
  "少熬夜伤身体",
  "宝宝我想你了",
];
const TITLE   = "来自 杰宝 的关心";
// 随机取一条祝福语
const randMsg = () => MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
/* ==================================================================== */

const W = 150, H = 62;          // 弹窗尺寸
const rand = (a, b) => a + Math.random() * (b - a);

// 爱心参数方程：只沿轮廓生成密集点位（不填充内部）
function heartPoints(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 6 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    // 微小随机抖动，让轮廓边缘自然但不散乱
    pts.push({ x: x + rand(-0.3, 0.3), y: -y + rand(-0.3, 0.3) });
  }
  return pts;
}

// 把点位映射到屏幕坐标（爱心居中、按屏幕大小自适应）
function toScreen(pts) {
  const sw = innerWidth, sh = innerHeight;
  // 爱心在屏幕上半部分显示
  const availH = sh * 0.9, availW = sw * 0.9;
  const scale = Math.min(availW / 34, availH / 32);   // 参数方程 x 范围 ±16, y 范围约 -18~14
  const cx = sw / 2, cy = sh / 2;
  return pts.map(p => ({
    left: cx + p.x * scale - W / 2,
    top:  cy + p.y * scale - H / 2
  }));
}

// 创建一个弹窗元素
function makePopup(left, top, text) {
  const el = document.createElement("div");
  el.className = "popup";
  el.style.left = left + "px";
  el.style.top  = top + "px";
  el.innerHTML =
    '<div class="bar"><span>' + TITLE + '</span><div class="x">×</div></div>' +
    '<div class="body">' + (text || randMsg()) + '</div>';
  document.body.appendChild(el);
  return el;
}

// 阶段一：弹窗逐个弹出，拼成爱心
function stageHeart() {
  const pts = toScreen(heartPoints(130));   // 轮廓弹窗数量，越大越密集
  const gap = 35;                     // 每个弹窗弹出间隔（ms）
  const total = pts.length * gap;
  // 爱心展示 1 秒后，从第 1 个到最后 1 个逐个淡出
  const fadeGap = 15;                 // 每个弹窗淡出间隔（ms），越小消失越快
  pts.forEach((p, i) => {
    setTimeout(() => {
      const el = makePopup(p.left, p.top, randMsg());
      // 后创建的弹窗盖在先创建的上面（按创建顺序递增层级）
      el.style.zIndex = 1000 + i;
      // 弹窗创建时立即注册自己的淡出时间（需减去已等待的 i*gap，保证按绝对时间顺序淡出）
      setTimeout(() => el.classList.add("fade"), total + 1000 + i * (fadeGap - gap));
    }, i * gap);
  });
  // 全部淡出完成后进入阶段二
  const fadeEnd = total + 1000 + pts.length * fadeGap + 600;
  setTimeout(stageFill, fadeEnd);
}

// 阶段二：在屏幕范围内随机位置不断生成弹窗，直到铺满全屏
function stageFill() {
  document.body.querySelectorAll(".popup").forEach(el => el.remove());

  const cols = Math.ceil(innerWidth / (W * 0.7));
  const rows = Math.ceil(innerHeight / (H * 0.7));
  const total = cols * rows;
  const gap = Math.max(8, 600 / total);   // 控制总耗时

  // 每个弹窗的位置完全随机生成
  for (let i = 0; i < total; i++) {
    setTimeout(() => {
      const left = rand(0, innerWidth - W);
      const top  = rand(0, innerHeight - H);
      makePopup(left, top, randMsg());
    }, i * gap);
  }
}

// 点击开始页启动
document.getElementById("start").addEventListener("click", function () {
  this.style.opacity = "0";
  setTimeout(() => this.remove(), 500);
  setTimeout(stageHeart, 400);
});
</script>
</body>
</html>
