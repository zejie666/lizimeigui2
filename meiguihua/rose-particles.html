<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>粒子汇聚成玫瑰</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050005;
    }
    canvas {
      display: block;
    }
    #runBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 8px 18px;
      font-size: 13px;
      color: #ff3366;
      background: rgba(5, 0, 5, 0.6);
      border: 1px solid #ff3366;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    #runBtn:hover {
      background: #ff3366;
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
    }
    #runBtn.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      pointer-events: none;
      user-select: none;
    }
    #lyrics {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 680px;
      color: rgba(255, 230, 238, 0.95);
      font-size: 18px;
      line-height: 1.6;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      text-shadow: 0 0 12px rgba(255, 51, 102, 0.6), 0 0 24px rgba(255, 51, 102, 0.3);
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
      user-select: none;
      z-index: 5;
    }
    #lyrics.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <audio id="bgm" src="bgm.mp3" preload="metadata"></audio>
  <div id="lyrics"></div>
  <button id="runBtn">运行</button>
  <div class="hint"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const runBtn = document.getElementById('runBtn');
    const bgm = document.getElementById('bgm');
    const lyricsEl = document.getElementById('lyrics');

    let width, height, centerX, centerY;
    const PARTICLE_COUNT = 2600;
    const FIT_RATIO = 0.72;
    const PETAL_COLOR = '#ff0033'; // 玫瑰红
    const LEAF_COLOR = '#00cc44';  // 鲜绿色

    let rosePixels = [];
    const particles = [];
    let isRunning = false;
    let animationId = null;
    let imgLoaded = false;

    // 直接读取用户提供的参考图，按图片中的深色线条采样粒子目标点
    const ROSE_IMG_URL = 'rose_ref.png';

    let lyricsData = [];

    function parseLRC(text) {
      const lines = text.split(/\r?\n/);
      const result = [];
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
      for (const line of lines) {
        const match = line.match(timeRegex);
        if (match) {
          const min = parseInt(match[1], 10);
          const sec = parseInt(match[2], 10);
          const ms = parseInt(match[3].padEnd(3, '0'), 10);
          const time = min * 60 + sec + ms / 1000;
          const textContent = line.replace(timeRegex, '').trim();
          if (textContent) {
            result.push({ time, text: textContent });
          }
        }
      }
      return result.sort((a, b) => a.time - b.time);
    }

    async function loadLyrics() {
      // 直接双击 HTML 打开时（file:// 协议），fetch 本地文件会被浏览器拦截，跳过歌词加载
      if (location.protocol === 'file:') {
        lyricsData = [];
        return;
      }
      try {
        const res = await fetch('lyrics.lrc');
        if (!res.ok) throw new Error('lyrics not found');
        const text = await res.text();
        lyricsData = parseLRC(text);
      } catch (e) {
        lyricsData = [];
      }
    }

    function updateLyrics() {
      if (!lyricsData.length) return;
      const current = bgm.currentTime;
      const firstTime = lyricsData[0].time;
      const lastTime = lyricsData[lyricsData.length - 1].time;

      // 开始演唱前和结束后隐藏歌词
      if (current < firstTime || current > lastTime + 3) {
        lyricsEl.classList.remove('show');
        return;
      }

      let text = lyricsData[0].text;
      for (let i = 0; i < lyricsData.length; i++) {
        if (current >= lyricsData[i].time) {
          text = lyricsData[i].text;
        } else {
          break;
        }
      }
      if (lyricsEl.textContent !== text) {
        lyricsEl.textContent = text;
      }
      lyricsEl.classList.add('show');
    }

    bgm.addEventListener('timeupdate', updateLyrics);

    function resize() {
      width = window.innerWidth || document.documentElement.clientWidth || 800;
      height = window.innerHeight || document.documentElement.clientHeight || 600;
      canvas.width = width;
      canvas.height = height;
      centerX = width / 2;
      centerY = height / 2;
    }

    function randomStartPoint() {
      const side = Math.floor(Math.random() * 4);
      const margin = 160;
      switch (side) {
        case 0: return { x: Math.random() * width, y: -margin };
        case 1: return { x: width + margin, y: Math.random() * height };
        case 2: return { x: Math.random() * width, y: height + margin };
        default: return { x: -margin, y: Math.random() * height };
      }
    }

    function randomRosePoint() {
      return rosePixels[Math.floor(Math.random() * rosePixels.length)];
    }

    class Particle {
      constructor() {
        this.size = Math.random() * 0.8 + 0.25;
        this.alpha = 0.95; // 固定透明度，呈现纯色
        this.settled = false;
        this.startTime = 0;
        this.startDelay = Math.random() * 500; // 0-500ms 随机延迟
        this.duration = 6200 + Math.random() * 3200; // 6.2-9.4秒飞行时间
        this.setTarget();
        const start = randomStartPoint();
        this.startX = start.x;
        this.startY = start.y;
        this.x = start.x;
        this.y = start.y;
      }

      setTarget() {
        const t = randomRosePoint();
        this.targetX = t.x;
        this.targetY = t.y;
        this.color = t.type === 'leaf' ? LEAF_COLOR : PETAL_COLOR;
      }

      reset() {
        this.settled = false;
        this.setTarget();
        this.startDelay = Math.random() * 500;
        this.duration = 6200 + Math.random() * 3200;
        const start = randomStartPoint();
        this.startX = start.x;
        this.startY = start.y;
        this.x = start.x;
        this.y = start.y;
      }

      begin(now) {
        this.startTime = now + this.startDelay;
      }

      update(now) {
        if (this.settled) return;

        if (now < this.startTime) {
          this.x = this.startX;
          this.y = this.startY;
          return;
        }

        const elapsed = now - this.startTime;
        let t = elapsed / this.duration;

        if (t >= 1) {
          this.x = this.targetX;
          this.y = this.targetY;
          this.settled = true;
          return;
        }

        // easeOutCubic：全程较慢，自然减速汇聚
        const ease = 1 - Math.pow(1 - t, 3);
        this.x = this.startX + (this.targetX - this.startX) * ease;
        this.y = this.startY + (this.targetY - this.startY) * ease;
      }

      draw() {
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particles.length = 0;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }
    }

    function resetParticles() {
      for (const p of particles) {
        p.reset();
      }
    }

    function sampleRosePixels(img) {
      const imgW = img.naturalWidth || 320;
      const imgH = img.naturalHeight || 440;
      const scale = (FIT_RATIO * Math.min(width, height)) / Math.max(imgW, imgH);
      const roseW = imgW * scale;
      const roseH = imgH * scale;
      const offsetX = centerX - roseW / 2;
      const offsetY = centerY - roseH / 2;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = Math.max(1, Math.ceil(roseW));
      offCanvas.height = Math.max(1, Math.ceil(roseH));
      const offCtx = offCanvas.getContext('2d');
      offCtx.drawImage(img, 0, 0, offCanvas.width, offCanvas.height);

      rosePixels = [];
      const imageData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
      const data = imageData.data;
      const step = 1;
      const threshold = 75; // 亮度阈值：只保留较深的黑色线条
      const minRegionSize = 150; // 最小连通区域大小，小于此值的视为杂点/水印

      // 1. 二值化
      const totalPixels = offCanvas.width * offCanvas.height;
      const bin = new Uint8Array(totalPixels);
      for (let y = 0; y < offCanvas.height; y++) {
        for (let x = 0; x < offCanvas.width; x++) {
          const idx = (y * offCanvas.width + x) * 4;
          const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
          if (brightness < threshold) {
            bin[y * offCanvas.width + x] = 1;
          }
        }
      }

      // 2. 连通区域标记
      const labels = new Int32Array(totalPixels);
      const regions = [];
      let currentLabel = 0;

      for (let y = 0; y < offCanvas.height; y++) {
        for (let x = 0; x < offCanvas.width; x++) {
          const i = y * offCanvas.width + x;
          if (bin[i] === 1 && labels[i] === 0) {
            currentLabel++;
            let size = 0;
            const stack = [i];
            labels[i] = currentLabel;
            while (stack.length > 0) {
              const cur = stack.pop();
              size++;
              const cx = cur % offCanvas.width;
              const cy = Math.floor(cur / offCanvas.width);
              if (cx > 0 && bin[cur - 1] === 1 && labels[cur - 1] === 0) {
                labels[cur - 1] = currentLabel;
                stack.push(cur - 1);
              }
              if (cx < offCanvas.width - 1 && bin[cur + 1] === 1 && labels[cur + 1] === 0) {
                labels[cur + 1] = currentLabel;
                stack.push(cur + 1);
              }
              if (cy > 0 && bin[cur - offCanvas.width] === 1 && labels[cur - offCanvas.width] === 0) {
                labels[cur - offCanvas.width] = currentLabel;
                stack.push(cur - offCanvas.width);
              }
              if (cy < offCanvas.height - 1 && bin[cur + offCanvas.width] === 1 && labels[cur + offCanvas.width] === 0) {
                labels[cur + offCanvas.width] = currentLabel;
                stack.push(cur + offCanvas.width);
              }
            }
            regions.push({ label: currentLabel, size });
          }
        }
      }

      // 3. 保留大小超过阈值的连通区域（过滤小水印/字母 R/杂点）
      const keptLabels = new Set();
      for (const region of regions) {
        if (region.size >= minRegionSize) {
          keptLabels.add(region.label);
        }
      }

      // 4. 采样保留的区域，并过滤右下角水印/字母区域
      const ignoreX = offCanvas.width * 0.72;
      const ignoreY = offCanvas.height * 0.78;
      const flowerThresholdY = offCanvas.height * 0.45; // 上方45%为花瓣，下方为叶子/茎
      for (let y = 0; y < offCanvas.height; y += step) {
        for (let x = 0; x < offCanvas.width; x += step) {
          const i = y * offCanvas.width + x;
          if (keptLabels.has(labels[i]) && !(x > ignoreX && y > ignoreY)) {
            rosePixels.push({
              x: offsetX + x,
              y: offsetY + y,
              type: y > flowerThresholdY ? 'leaf' : 'petal'
            });
          }
        }
      }

      if (rosePixels.length === 0) {
        rosePixels.push({ x: centerX, y: centerY, type: 'petal' });
      }

      return { offsetX, offsetY, roseW, roseH };
    }

    function loadRoseImage() {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            sampleRosePixels(img);
            imgLoaded = true;
            resolve();
          } catch (e) {
            console.error('采样玫瑰图片失败:', e);
            reject(e);
          }
        };
        img.onerror = () => {
          console.error('玫瑰图片加载失败:', ROSE_IMG_URL);
          reject(new Error('image load failed'));
        };
        img.src = ROSE_IMG_URL;
      });
    }

    function animate(now) {
      ctx.clearRect(0, 0, width, height);
      let settledCount = 0;
      for (const p of particles) {
        p.update(now);
        p.draw();
        if (p.settled) settledCount++;
      }

      // 所有粒子都到达目标后停止动画，在右下角显示重新运行按钮
      if (settledCount >= particles.length) {
        isRunning = false;
        runBtn.textContent = '重新运行';
        runBtn.classList.remove('hidden');
        return;
      }

      animationId = requestAnimationFrame(animate);
    }

    function startConverge() {
      if (isRunning) return;
      if (!imgLoaded) return;

      isRunning = true;
      runBtn.classList.add('hidden');

      // 播放背景音乐（歌词会在唱到第一句时自动显示）
      bgm.currentTime = 0;
      bgm.play().catch(() => {});

      if (particles.length === 0) {
        initParticles();
      } else {
        resetParticles();
      }

      const now = performance.now();
      for (const p of particles) {
        p.begin(now);
      }

      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(animate);
    }

    runBtn.addEventListener('click', startConverge);

    resize();
    window.addEventListener('resize', () => {
      resize();
      loadRoseImage().then(() => {
        if (particles.length > 0) {
          resetParticles();
          if (!isRunning) {
            ctx.clearRect(0, 0, width, height);
            for (const p of particles) {
              p.x = p.targetX;
              p.y = p.targetY;
              p.settled = true;
              p.draw();
            }
          }
        }
      });
    });

    function startApp() {
      resize();
      loadLyrics();
      loadRoseImage().then(() => {
        initParticles();
        // 图片加载完成后自动开始汇聚动画
        startConverge();
      }).catch((err) => {
        console.error('页面初始化失败:', err);
      });
    }

    // 等页面资源准备好后再开始，避免双击打开时尺寸为 0
    if (document.readyState === 'complete') {
      startApp();
    } else {
      window.addEventListener('load', startApp);
    }
  </script>
</body>
</html>
